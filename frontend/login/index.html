<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <title>n0th1ng AI — Workstation Locked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <div class="login-ambient" aria-hidden="true"></div>
    <section class="login-card" id="loginCard" aria-labelledby="pageTitle">
      <header class="login-brand">
        <span class="login-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" focusable="false">
            <rect x="4.5" y="10" width="15" height="11" rx="2.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 10V7.5a4 4 0 0 1 8 0V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M12 14.5v2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <span class="login-wordmark">n0th1ng <span>AI</span></span>
        <span class="login-status-dot" aria-hidden="true"></span>
      </header>

      <div class="login-content">
        <p class="login-eyebrow" id="eyebrow">PRIVATE WORKSTATION</p>
        <h1 id="pageTitle">Checking workstation</h1>
        <p class="login-description" id="description">Verifying secure access…</p>

        <form id="authForm" class="login-form" hidden novalidate>
          <div class="login-field" id="passwordField">
            <label for="password">Password</label>
            <div class="login-input-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="passwordError" spellcheck="false">
              <button class="login-reveal" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                <svg class="login-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <svg class="login-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="m3 3 18 18M10.6 6.2A10 10 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15 15 0 0 1-3.2 3.7M6.2 6.8C3.8 8.4 2.5 12 2.5 12s3.4 6 9.5 6c1.3 0 2.5-.3 3.5-.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <p class="login-field-error" id="passwordError" hidden></p>
          </div>

          <div class="login-field" id="confirmField" hidden>
            <label for="confirmPassword">Confirm password</label>
            <div class="login-input-wrap">
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="confirmError" spellcheck="false" disabled>
              <button class="login-reveal" type="button" data-toggle-password="confirmPassword" aria-label="Show password" aria-pressed="false" tabindex="-1" disabled>
                <svg class="login-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <svg class="login-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="m3 3 18 18M10.6 6.2A10 10 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15 15 0 0 1-3.2 3.7M6.2 6.8C3.8 8.4 2.5 12 2.5 12s3.4 6 9.5 6c1.3 0 2.5-.3 3.5-.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <p class="login-field-error" id="confirmError" hidden></p>
          </div>

          <label class="login-remember" id="rememberRow" for="rememberMe" hidden>
            <input id="rememberMe" name="rememberMe" type="checkbox" checked disabled>
            <span class="login-check-ui" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" focusable="false"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </span>
            <span>Remember this device</span>
          </label>

          <p class="login-message" id="formMessage" role="status" aria-live="polite" hidden></p>

          <div class="login-submit-row">
            <button class="login-submit" id="submitButton" type="submit" disabled>
              <span id="submitLabel">Continue</span>
              <svg class="login-submit-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <span class="login-countdown" id="countdown" role="status" aria-live="off" hidden></span>
          </div>
        </form>

        <div class="login-status-view" id="statusView" role="status" aria-live="polite">
          <p class="login-message" id="statusMessage" hidden></p>
          <button class="login-retry" id="statusRetry" type="button" hidden>Retry check</button>
        </div>

        <div class="login-success" id="successView" hidden aria-live="polite">
          <span class="login-success-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" focusable="false"><path d="m5 12.5 4.4 4.2L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span>
          <p>Workstation unlocked</p>
        </div>
      </div>

      <footer class="login-footer"><span>LOCAL ACCESS</span><span class="login-footer-separator" aria-hidden="true">/</span><span>SESSION PROTECTED</span></footer>
    </section>
  </main>
</body>
</html>
