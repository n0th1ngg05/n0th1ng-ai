services:
  db:
    # MySQL 8: the migrations are generated for MySQL (MariaDB rejects `serial AUTO_INCREMENT`).
    # The MARIADB_* names in .env are kept so existing .env files keep working.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-n0th1ng}
      MYSQL_USER: ${MARIADB_USER:-n0th1ng}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    command: ["--innodb-buffer-pool-size=3G", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - uploads:/app/app/uploads
      - appdata:/app/app/data
      - storage:/app/storage

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]

  ollama-embed:
    image: ollama/ollama:latest
    profiles: [embeddings]
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]

volumes: { dbdata: {}, uploads: {}, appdata: {}, storage: {}, ollama: {} }
