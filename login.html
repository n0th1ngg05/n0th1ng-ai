<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Lock &mdash; n0th1ng AI</title>
  <meta name="description" content="Secure Workstation Gate for n0th1ng AI" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/assets/nav.css">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 20, 32, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --aurora-1: #6366f1;
      --aurora-2: #a855f7;
      --aurora-3: #06b6d4;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 20% 70%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .aurora-blur {
      position: absolute;
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2), var(--aurora-3));
      filter: blur(120px);
      opacity: 0.15;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: float 14s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-30px, -20px) scale(0.95); }
      100% { transform: translate(30px, 20px) scale(1.05); }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .brand-logo img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(10, 15, 26, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--border-focus);
      background: rgba(10, 15, 26, 0.9);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: var(--aurora-1);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 13px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(168, 85, 247, 0.85));
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -5px rgba(99, 102, 241, 0.6);
      filter: brightness(1.1);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: block;
    }

    .alert.info {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #67e8f9;
      display: block;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-family: 'JetBrains Mono', monospace;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="aurora-blur"></div>

  <div class="login-container">
    <div class="card">
      <div class="brand-header">
        <div class="brand-logo">
          <img src="/frontend/assets/logo.png" alt="n0th1ng Logo" onerror="this.style.display='none'">
        </div>
        <div class="brand-name">n0th1ng AI</div>
        <div class="brand-tag">Workstation Terminal</div>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="authForm" autocomplete="off">
        <div class="form-group">
          <label for="password" id="passwordLabel">Master Passphrase</label>
          <div class="input-wrap">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter master password" 
              required 
              autofocus
              spellcheck="false"
            />
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember this device (30 days)</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <div class="spinner" id="spinner"></div>
          <span id="btnText">Unlock Workstation</span>
        </button>
      </form>

      <div class="footer-note">
        Single-User Protected Node &bull; Argon2id
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('authForm');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const alertBox = document.getElementById('alertBox');
    const passwordLabel = document.getElementById('passwordLabel');
    const rememberMeCheckbox = document.getElementById('rememberMe');

    let isSetupMode = false;

    // Check status on load
    async function checkStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data && data.configured === false) {
          isSetupMode = true;
          passwordLabel.textContent = "Create Master Passphrase";
          passwordInput.placeholder = "Choose a strong password (min 8 chars)";
          btnText.textContent = "Initialize Workstation";
          showAlert("Initial Setup: Set your workstation master passphrase.", "info");
        }
      } catch (err) {
        console.warn("Status check failed:", err);
      }
    }

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
    }

    function clearAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.style.display = loading ? 'block' : 'none';
      btnText.style.opacity = loading ? '0.7' : '1';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const password = passwordInput.value;
      if (!password) return;

      setLoading(true);

      const endpoint = isSetupMode ? '/api/auth/setup' : '/api/auth/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password,
            rememberMe: rememberMeCheckbox.checked,
            deviceLabel: navigator.userAgent.slice(0, 80),
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        // On success, redirect to home or referer
        const urlParams = new URLSearchParams(window.location.search);
        const returnTo = urlParams.get('returnTo') || '/';
        window.location.href = returnTo;
      } catch (err) {
        showAlert(err.message, 'error');
        passwordInput.value = '';
        passwordInput.focus();
      } finally {
        setLoading(false);
      }
    });

    checkStatus();
  </script>
</body>
</html>
